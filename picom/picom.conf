# picom compositor config
backend = "glx";
shadow = true;

# Shadows
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.6;

# Fading
fading = true;
fade-in-step = 0.07;
fade-out-step = 0.07;

# Don't take over the whole screen's direct rendering (fixes flicker on fullscreen)
unredir-if-possible = true;

# Alacritty: no shadows (looks bad on terminal borders) and keep it snappy
shadow-exclude = [
  "class_g = 'Alacritty'"
];

# Avoid unredirecting when Alacritty is visible so transparency keeps working
unredir-if-possible-exclude = [
  "class_g = 'Alacritty'"
];
